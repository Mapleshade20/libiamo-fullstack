name: Lint and Test

on:
  push:
  workflow_dispatch:

jobs:
  primary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run svelte-check
        run: pnpm svelte-kit sync && pnpm svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - name: Run biome
        run: pnpm biome ci --error-on-warnings .
      - name: Run vitest
        run: pnpm vitest run
      # pre-commit/action@v3.0.1 (its latest) pins actions/cache@v4, which runs on the
      # deprecated Node 20; these are its steps with a current cache action.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --all-files
