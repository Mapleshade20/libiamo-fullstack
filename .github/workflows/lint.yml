name: Lint and Test

on:
  push:
  workflow_dispatch:

jobs:
  primary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run svelte-check
        run: pnpm svelte-kit sync && pnpm svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - name: Run biome
        run: pnpm biome ci --error-on-warnings .
      - name: Run vitest
        run: pnpm vitest run --reporter github-actions
      - uses: actions/setup-python@v3
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
