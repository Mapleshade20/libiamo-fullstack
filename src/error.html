<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex, nofollow">
		<title>%sveltekit.status% · Libiamo</title>
		<style>
		* {
			box-sizing: border-box;
		}
		body {
			min-height: 100vh;
			margin: 0;
			background: radial-gradient(circle at 85% 75%, rgba(179, 145, 80, 0.11), transparent 30rem), #f7f1e6;
			color: #2d2924;
			font-family: ui-sans-serif, system-ui, sans-serif;
		}
		header {
			display: flex;
			width: min(calc(100% - 2rem), 72rem);
			min-height: 4.75rem;
			margin: auto;
			align-items: center;
			border-bottom: 1px solid rgba(45, 41, 36, 0.14);
			font-family: Georgia, serif;
			font-size: 1.2rem;
		}
		main {
			display: grid;
			width: min(calc(100% - 2rem), 54rem);
			min-height: calc(100vh - 4.75rem);
			margin: auto;
			place-items: center;
			padding: 3rem 0;
		}
		section {
			width: 100%;
			padding: clamp(2rem, 7vw, 4.5rem);
			border: 1px solid rgba(45, 41, 36, 0.15);
			background: #fffaf1;
			box-shadow: 0 30px 70px rgba(45, 41, 36, 0.13);
		}
		.status {
			margin: 0 0 1rem;
			color: #803945;
			font-size: 0.72rem;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}
		h1 {
			max-width: 13ch;
			margin: 0;
			font-family: Georgia, serif;
			font-size: clamp(2.4rem, 7vw, 4.4rem);
			font-weight: 400;
			line-height: 1.05;
		}
		.message {
			max-width: 36rem;
			margin: 1.25rem 0 0;
			color: #6d665d;
			line-height: 1.65;
		}
		.actions {
			display: flex;
			flex-wrap: wrap;
			gap: 0.75rem;
			margin-top: 2rem;
		}
		a,
		button {
			display: inline-flex;
			min-height: 44px;
			align-items: center;
			justify-content: center;
			padding: 0.7rem 1rem;
			border: 1px solid #803945;
			font: inherit;
			font-size: 0.8rem;
			font-weight: 700;
			text-decoration: none;
			cursor: pointer;
		}
		a {
			background: #803945;
			color: #fffaf1;
		}
		button {
			background: transparent;
			color: #2d2924;
		}
		a:focus-visible,
		button:focus-visible {
			outline: 2px solid #305f89;
			outline-offset: 3px;
		}
		@media (max-width: 34rem) {
			.actions {
				flex-direction: column;
			}
		}
		</style>
	</head>
	<body>
		<header>Libiamo</header>
		<main>
			<section role="alert" aria-labelledby="error-title">
				<p class="status">Error · %sveltekit.status%</p>
				<h1 id="error-title">We couldn’t open this page.</h1>
				<p class="message">%sveltekit.error.message%</p>
				<div class="actions">
					<a href="/">Return to Libiamo</a>
					<button type="button" onclick="location.reload()">Try again</button>
				</div>
			</section>
		</main>
	</body>
</html>
