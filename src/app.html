<!doctype html>
<html lang="en" dir="ltr" class="%html.class%" data-theme="%theme%" data-backdrop="%backdrop%">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="color-scheme" content="light dark">
		<meta name="darkreader-lock">
		<link rel="icon" href="%sveltekit.assets%/favicon.ico">
		<title>Libiamo</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italianno&display=swap">
		<script>
		// The learner's theme is on <html> from the server; "system" is decided here, before the first paint
		// (lib/account/look.svelte.ts follows the system after). Paintings are for the light theme only.
		(() => {
			const html = document.documentElement;
			if (html.dataset.theme === "system") html.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
			if (html.dataset.theme === "dark" && html.dataset.backdrop === "painting") html.dataset.backdrop = "none";
			// Back from the session page (a separate document): name the trip so the scene card shrinks into the box.
			addEventListener("pagereveal", (e) => {
				const from = navigation?.activation?.from?.url;
				if (!e.viewTransition || !from) return;
				html.dataset.vt = `${new URL(from).pathname}>${location.pathname}`;
				e.viewTransition.finished.finally(() => delete html.dataset.vt);
			});
		})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
