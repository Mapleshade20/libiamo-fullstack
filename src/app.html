<!doctype html>
<html lang="en" data-backdrop="none">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="color-scheme" content="light dark">
		<meta name="darkreader-lock">
		<link rel="icon" href="%sveltekit.assets%/favicon.ico">
		<title>Libiamo</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italianno&display=swap">
		<script>
		// Light or dark before the first paint: the learner's choice, else the system's (lib/demo/theme.ts keeps it after).
		(() => {
			const c = localStorage.getItem("theme");
			const dark = c === "dark" || (c !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
			document.documentElement.dataset.theme = dark ? "dark" : "light";
			if (localStorage.getItem("sideFolded") === "1") document.documentElement.classList.add("side-folded");
			// Back from the session page (a separate document): name the trip so the scene card shrinks into the box.
			addEventListener("pagereveal", (e) => {
				const from = navigation?.activation?.from?.url;
				if (!e.viewTransition || !from) return;
				document.documentElement.dataset.vt = `${new URL(from).pathname}>${location.pathname}`;
				e.viewTransition.finished.finally(() => delete document.documentElement.dataset.vt);
			});
		})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
