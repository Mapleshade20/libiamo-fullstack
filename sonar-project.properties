sonar.sources=src

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.projectKey=Mapleshade20_libiamo-fullstack
sonar.organization=chorus-lab

# Google Fonts CSS is dynamic per User-Agent (serves different font formats)
# — a static SRI hash would break for some browsers. TLS ensures integrity.
sonar.issue.ignore.multicriteria=sri-fonts
sonar.issue.ignore.multicriteria.sri-fonts.ruleKey=Web:ResourceIntegrityCheck
sonar.issue.ignore.multicriteria.sri-fonts.resourceKey=**/app.html

# Align Sonar coverage scope with Vitest exclude patterns in vite.config.ts.
# These files are framework glue (thin request handlers delegating to
# already-tested service functions) or contain only DB/LLM-bound error
# branches that would require garbage mocks to cover.
sonar.coverage.exclusions=**/feedback/+page.server.ts,src/routes/api/review/**
